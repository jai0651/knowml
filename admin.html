<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<script>try{var k="np-theme",v=localStorage.getItem(k);
if(!localStorage.getItem("np-theme-v2")){if(v==="light"){localStorage.removeItem(k);v=null}localStorage.setItem("np-theme-v2","1")}
document.documentElement.setAttribute("data-theme",v||"dark")}catch(e){}</script>
<title>Stats · KnowML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/style.css">
<style>
/* Scoped to this page. Nothing here is used anywhere else on the site, so it
   stays out of style.css. */
.ad-wrap { max-width: 1180px; margin: 0 auto; padding: 34px 24px 90px; }

.ad-login { max-width: 380px; margin: 14vh auto; }
.ad-login h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -.015em; }
.ad-login p { color: var(--text-dim); font-size: 14px; margin: 0 0 24px; }
.ad-field { display: block; margin-bottom: 14px; }
.ad-field span { display: block; font-size: 12px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; }
.ad-field input {
  width: 100%; padding: 11px 13px; font: inherit; font-size: 14px;
  background: var(--bg-card); color: var(--text);
  border: 1px solid var(--border); border-radius: 9px;
}
.ad-field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.ad-btn {
  width: 100%; padding: 11px 18px; font: inherit; font-size: 14px; font-weight: 700;
  background: var(--text); color: var(--bg); border: none; border-radius: 9px; cursor: pointer;
}
.ad-btn:disabled { opacity: .55; cursor: default; }
.ad-err {
  font-size: 13px; color: var(--know-cold); margin-top: 14px; min-height: 18px;
}
.ad-note {
  margin-top: 26px; padding: 14px 16px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--bg-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.6;
}
.ad-note code { font-size: 11.5px; }

.ad-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 26px; }
.ad-head h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
.ad-head .spacer { flex: 1; }
.ad-range { display: inline-flex; background: var(--bg-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
.ad-range button {
  border: 0; background: none; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 700;
  color: var(--text-dim); padding: 6px 14px; border-radius: 999px;
}
.ad-range button.is-on { background: var(--bg-card); color: var(--text); box-shadow: var(--shadow-sm); }
.ad-logout { font-size: 12.5px; font-weight: 600; color: var(--text-dim); background: none; border: 0; cursor: pointer; }
.ad-logout:hover { color: var(--text); }

.ad-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 26px; }
@media (max-width: 900px) { .ad-kpis { grid-template-columns: repeat(2, 1fr); } }
.ad-kpi { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; }
.ad-kpi .k-num { font-size: 28px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ad-kpi .k-lbl { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }

.ad-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 22px; margin-bottom: 18px; }
.ad-card h2 { font-size: 15px; margin: 0 0 4px; letter-spacing: -.01em; }
.ad-card .sub { font-size: 12px; color: var(--text-faint); margin: 0 0 18px; }

/* start, not stretch: the referrers card has four rows and sits beside a
   thirty-row list, and stretching left it mostly empty. */
.ad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 900px) { .ad-grid { grid-template-columns: 1fr; } }

/* the daily chart: plain divs, no library */
.ad-chart { display: flex; align-items: flex-end; gap: 2px; height: 150px; }
.ad-bar { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; position: relative; }
.ad-bar i { display: block; background: var(--accent); border-radius: 2px 2px 0 0; opacity: .85; }
.ad-bar u { display: block; background: color-mix(in srgb, var(--accent) 34%, transparent); border-radius: 0 0 2px 2px; }
.ad-bar:hover i { opacity: 1; }
.ad-bar:hover::after {
  content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  white-space: nowrap; background: var(--bg-1); border: 1px solid var(--border-hover);
  border-radius: 7px; padding: 6px 9px; font-size: 11.5px; font-family: var(--font-mono);
  box-shadow: var(--shadow-lg); z-index: 5; margin-bottom: 5px;
}
.ad-axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-faint); font-family: var(--font-mono); margin-top: 8px; }
.ad-legend { display: flex; gap: 16px; font-size: 11.5px; color: var(--text-faint); margin-top: 10px; }
.ad-legend i, .ad-legend u { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.ad-legend i { background: var(--accent); }
.ad-legend u { background: color-mix(in srgb, var(--accent) 34%, transparent); }

.ad-rows { display: flex; flex-direction: column; gap: 1px; }
.ad-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 7px 0; font-size: 13px; position: relative; }
.ad-row + .ad-row { border-top: 1px solid var(--border-soft); }
.ad-row .r-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ad-row .r-name a { color: var(--text); }
.ad-row .r-n { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-dim); text-align: right; min-width: 46px; }
.ad-row .r-n--dim { color: var(--text-faint); }
.ad-row::before {
  content: ''; position: absolute; left: -6px; top: 2px; bottom: 2px; width: var(--w, 0%);
  background: color-mix(in srgb, var(--accent) 11%, transparent); border-radius: 4px; z-index: 0; pointer-events: none;
}
.ad-row > * { position: relative; z-index: 1; }
.ad-empty { font-size: 13px; color: var(--text-faint); font-style: italic; padding: 10px 0; }
.ad-foot { font-size: 12px; color: var(--text-faint); line-height: 1.65; margin-top: 22px; }
</style>
</head>
<body data-section="admin">
<div class="ad-wrap" id="root">
  <div class="ad-empty" style="text-align:center;margin-top:16vh">Loading…</div>
</div>
<script src="assets/js/admin.js"></script>
</body>
</html>
