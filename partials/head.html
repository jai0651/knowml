<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* Set the theme before first paint. Without this the page renders with the
   hardcoded data-theme below, then app.js corrects it ~600 lines later, so every
   navigation flashed before settling.

   The migration matters as much as the default. The previous build defaulted to
   light AND wrote that default to storage on every single load, so a stored
   "light" is almost never a choice someone made — with light as the default, the
   only toggle worth making was the one to dark. Clearing a stored "light" once
   is what lets the new dark default actually reach people who never picked
   anything. Anyone who genuinely wants light toggles once and is remembered,
   because app.js now only persists on a real toggle. */
try{var k="np-theme",v=localStorage.getItem(k);
if(!localStorage.getItem("np-theme-v2")){if(v==="light"){localStorage.removeItem(k);v=null}localStorage.setItem("np-theme-v2","1")}
document.documentElement.setAttribute("data-theme",v||"dark")}catch(e){}
/* A skipped cross-document view transition rejects a promise no author code
   owns. It can fire before any deferred script has run, so the listener has to
   be registered here rather than in app.js. Matched narrowly: everything else,
   including unrelated AbortErrors, still reaches the console. */
addEventListener("unhandledrejection",function(e){var r=e.reason;if(r&&r.name==="AbortError"&&/transition was skipped/i.test(r.message||""))e.preventDefault()});</script>
<title>{{title}}</title>
{{descMeta}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
