<div class="notes-drawer" id="notesDrawer">
  <div class="notes-head"><h3>My Notes — {{notesTitle}}</h3><button class="iconbtn" id="notesClose">✕</button></div>
  <div class="notes-body">
    <h4>Free notes</h4>
    <textarea id="freeNotes" placeholder="{{notesPlaceholder}}"></textarea>
    <h4>Highlights on this page</h4>
    <div id="hlList"></div>
  </div>
  <div class="notes-foot">
    <button id="exportNotes">⇩ Export .md</button>
    <button id="clearNotes">Clear page</button>
  </div>
</div>
